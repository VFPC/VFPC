name: Add issues to vFPC Development Tracker

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/orgs/VFPC/projects/26
          github-token: ${{ secrets.PROJECT_TOKEN }}
